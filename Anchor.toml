[toolchain]
anchor_version = "0.32.1"

[features]
resolution = false
skip-lint = true

[programs.devnet]
camera_network = "E67WTa1NpFVoapXwYYQmXzru3pyhaN9Kj3wPdZEyyZsL"
competition_escrow = "EpczQBF7WmPcyzTtYJfzrPNXSVxM3YJsND7Vx8zpTLAj"

[programs.localnet]
camera_network = "E67WTa1NpFVoapXwYYQmXzru3pyhaN9Kj3wPdZEyyZsL"
competition_escrow = "EpczQBF7WmPcyzTtYJfzrPNXSVxM3YJsND7Vx8zpTLAj"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/program-keypairs/authority-keypair.json"

[scripts]
camera-network = "node scripts/camera-network-client.js"
face-checkin = "node scripts/face-recognition-checkin.js"
face-test = "node scripts/face-recognition-test.js"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
# Build individual programs (use these instead of plain `anchor build`)
build-camera = "anchor build -p camera_network"
build-escrow = "anchor build -p competition_escrow"

[hooks]

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = false
