[package]
name = "camera-network"
version = "0.1.0"
description = "Solana program for camera device network with check-in/check-out functionality"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "camera_network"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = ["idl-build"]
idl-build = ["anchor-lang/idl-build", "light-sdk/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
light-sdk = { version = "0.13.0", features = ["anchor"] }
light-hasher = { version = "3.1.0", features = ["solana"] }
light-sdk-types = "0.13.0"